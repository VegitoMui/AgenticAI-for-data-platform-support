resources:
  jobs:
    # Phase 1: polls system.lakeflow for newly failed runs and raises incidents.
    # Paused to avoid cost: run manually from Workflows > Jobs > Run now.
    watcher:
      name: "[${bundle.target}] agentic-ai watcher"
      schedule:
        quartz_cron_expression: "0 */5 * * * ?"
        timezone_id: Asia/Kolkata
        pause_status: PAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: detect_failed_runs
          python_wheel_task:
            package_name: agentic_ai
            entry_point: watcher
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema}
              - --secret-scope=${var.secret_scope}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - ../dist/*.whl
      email_notifications:
        on_failure:
          - ${var.approver_email}

    # Phase 2: diagnoses NEW incidents, routes to auto-execute or approval,
    # executes approved requests, closes rejected ones, expires stale ones,
    # and emails the approver.
    # Paused to avoid cost: run manually from Workflows > Jobs > Run now.
    reconciler:
      name: "[${bundle.target}] agentic-ai reconciler"
      schedule:
        quartz_cron_expression: "0 */2 * * * ?"
        timezone_id: Asia/Kolkata
        pause_status: PAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: reconcile
          python_wheel_task:
            package_name: agentic_ai
            entry_point: reconciler
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema}
              - --secret-scope=${var.secret_scope}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - ../dist/*.whl
      email_notifications:
        on_failure:
          - ${var.approver_email}

    # Phase 4b: checks the tables in scan_schemas for maintenance problems that never
    # make a job fail (small files, ...) and raises incidents for the reconciler.
    # Paused to avoid cost: run manually from Workflows > Jobs > Run now.
    scanner:
      name: "[${bundle.target}] agentic-ai table scanner"
      schedule:
        quartz_cron_expression: "0 0 */6 * * ?"
        timezone_id: Asia/Kolkata
        pause_status: PAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: scan_tables
          python_wheel_task:
            package_name: agentic_ai
            entry_point: scanner
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema}
              - --secret-scope=${var.secret_scope}
              - --scan-schemas=${var.scan_schemas}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - ../dist/*.whl
      email_notifications:
        on_failure:
          - ${var.approver_email}

    # One-shot: creates or migrates all Delta tables. Run manually after deploy.
    migrate:
      name: "[${bundle.target}] agentic-ai migrate"
      tasks:
        - task_key: migrate
          python_wheel_task:
            package_name: agentic_ai
            entry_point: migrate
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - ../dist/*.whl

  apps:
    # Phase 2: approve/reject UI. Runs under its own service principal,
    # provisioned by Databricks because a SQL warehouse is declared below.
    # Stop it from Compute > Apps when not in use -- it bills while running.
    approvals:
      name: agentic-ai-approvals-${bundle.target}
      description: Approve or reject remediation actions proposed by the agentic system
      source_code_path: ../src/agentic_ai/app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE