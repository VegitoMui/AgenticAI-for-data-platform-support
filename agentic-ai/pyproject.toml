[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_ai"
version = "0.1.0"
description = "Agentic auto-remediation system for Databricks data pipelines"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "langgraph>=0.2",
    "sentence-transformers>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.2"]

[project.scripts]
watcher = "agentic_ai.entrypoints:watcher_main"
reconciler = "agentic_ai.entrypoints:reconciler_main"
migrate = "agentic_ai.entrypoints:migrate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
